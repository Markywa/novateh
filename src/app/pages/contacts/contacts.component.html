<app-bread-crumbs></app-bread-crumbs>
<div class="container">
    <h2 class="main-title">Наши контакты</h2>
    @if(htmlContent$ | async; as content){
        <div class="container-wrap">
            <div class="container-section"> 
                <!-- @for(address of information.address; track address){
                    <div class="container-section__item">
                        <span class="container-section__item-title">{{ address.title }}</span>
                        @for(descr of address.description; track descr){
                            <span >{{ descr }}</span>
                        }
                    </div>
                } -->
                    <div [innerHTML]="content.html_first | safeHtml"></div>
            </div>
            <div class="container-section">
                <!-- @for(requisite of information.requisite; track requisite){
                    <div class="container-section__item">
                        <span class="container-section__item-title">{{ requisite.title }}</span>
                        <span>{{ requisite.value }}</span>
                    </div>
                } -->
                    
                <div [innerHTML]="content.html_second | safeHtml"></div>
            </div>
            <div class="container-form">
                <span class="container-section__item-title">Напишите нам</span>
                <form (ngSubmit)="onSubmit()" class="container-form__wrap">
                    <input placeholder="Имя" [(ngModel)]="formData.name" name="Имя" required>

                    <input placeholder="Ваш телефон" type="number" [(ngModel)]="formData.phone" name="Телефон" required>

                    <input placeholder="E-mail" [(ngModel)]="formData.email" name="Емаил" required>

                    <textarea rows="4" placeholder="Введите сообщение" [(ngModel)]="formData.message" name="Текст" required></textarea>

                    <button type="submit" class="default-button">
                        ОТПРАВИТЬ
                    </button>

                    <span class="container-form__description">Нажимая на кнопку, вы подтверждаете своё согласие
                        на обработку персональных данных и ознакомление с
                        политикой конфиденциальности</span>
                </form>
            </div>
        </div>
    }

</div>

@if(showSuccessMessage){
    <div class="success-toast">
        <div class="success-toast__content">
            <svg class="success-toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="success-toast__text">
                <strong>Заявка успешно отправлена!</strong>
                <span>Наш менеджер свяжется с вами в ближайшее время</span>
            </div>
            <button class="success-toast__close" (click)="closeSuccessMessage()">✕</button>
        </div>
    </div>
}
