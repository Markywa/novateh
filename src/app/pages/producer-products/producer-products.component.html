<div class="container">
    @if(loading){
        <app-loader></app-loader>
    } @else {
        <div class="container-header">
            <span class="main-title">Товары {{ brandEntity.brand.name }}</span>
            <img class="container-header__img" [src]="env.baseUrl + brandEntity.brand.media || 'assets/images/no-image2.png'"/>
        </div>
        @for(categories of brandEntity.categories; track categories.id){
        <div class="container-categories">
            <span class="second-title">{{ categories.name }}</span>
            <app-product-line [productList]="categories.products"></app-product-line>
        </div>
        }
    }
</div>
