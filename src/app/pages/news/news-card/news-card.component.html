<div class="container">
    <img [src]="newsFields.media[0] || 'assets/images/no-image2.png'" alt="">
    <div class="container-entity">
        <div class="container-entity__textfields">
            <span class="container-entity__textfields-title">
                {{ newsFields.title }}
            </span>
            <span class="container-entity__textfields-text">
                {{ newsFields.content }}
            </span>
        </div>
        <div class="container-entity__meta">
            <span>{{ convertDate(newsFields.published_at) }}</span>
            <button>подробнее</button>
        </div>
    </div>
</div>
