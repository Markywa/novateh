<div class="container">
    <img [src]="(environment.baseUrl + _newsFields.media) || 'assets/images/no-image2.png'" alt="">
    <div class="container-entity">
        <div class="container-entity__textfields">
            <span class="container-entity__textfields-title">
                {{ _newsFields.title }}
            </span>
            <span class="container-entity__textfields-text" [innerHTML]="_newsFields.content">
                <!-- {{ _newsFields.content }} -->
            </span>
        </div>
        <div class="container-entity__meta">
            <span>{{ convertDate(_newsFields.published_at) }}</span>
            <button [routerLink]="'/main/news/' + _newsFields.id">подробнее</button>
        </div>
    </div>
</div>
