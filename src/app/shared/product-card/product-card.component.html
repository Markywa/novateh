<div class="container" [routerLink]="'/main/product/' + productItem.slug">
    <div class="container-img">
        <img class="container-img" [src]="(environment.baseUrl + productItem.media[0]) || 'assets/images/no-image2.png'" alt="">
    </div>
    <span class="container-name">{{ productItem.name }}</span>
</div>
