<nav class="breadcrumbs">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item" 
            *ngFor="let breadcrumb of breadcrumbs; let last = last"
            [class.active]="!breadcrumb.isClickable">
          
          <a *ngIf="breadcrumb.isClickable && !last"
             [routerLink]="breadcrumb.url"
             class="breadcrumb-link">
            {{ breadcrumb.label }}
          </a>
          
          <span *ngIf="!breadcrumb.isClickable || last"
                class="breadcrumb-text">
            {{ breadcrumb.label }}
          </span>
          
          <span *ngIf="!last" class="breadcrumb-separator">/</span>
        </li>
      </ol>
    </nav>
