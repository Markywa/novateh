<div 
  class="carousel"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onTouchEnd()"
>
  <div class="carousel-container" #carouselContainer>
    <div 
      class="carousel-track" 
      [style.transform]="'translateX(-' + (currentIndex * 100) + '%)'"
    >
      <div 
        class="carousel-slide" 
        *ngFor="let item of items"
      >
        <img [src]="env.baseUrl + item.image" [alt]="item.title" class="slide-image">
        <div class="slide-content" *ngIf="item.title || item.description">
          <h3 *ngIf="item.title">{{ item.title }}</h3>
          <p *ngIf="item.description">{{ item.description }}</p>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="showIndicators && items.length > 1" class="carousel-indicators">
    <button 
      *ngFor="let item of items; let i = index" 
      class="indicator" 
      [class.active]="i === currentIndex"
      (click)="goTo(i)"
      [attr.aria-label]="'Go to slide ' + (i + 1)"
    ></button>
  </div>
</div>
