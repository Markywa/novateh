services:
  frontend-ssr:
    build: .
    container_name: novateh_frontend_ssr
    restart: unless-stopped
    environment:
      PORT: "4000"
      SSR_API_ORIGIN: "https://nvt24.ru"
    extra_hosts:
      - "nvt24.ru:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:3001:4000"
